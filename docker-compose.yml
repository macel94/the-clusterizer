services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: clusterizer
      POSTGRES_USER: clusterizer
      POSTGRES_PASSWORD: clusterizer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_pg18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clusterizer"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Ollama serves both the embedding and LLM endpoints locally.
  # GPU passthrough: add "deploy.resources.reservations.devices" if you have CUDA/ROCm.
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/version > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20

  # One-shot container that pulls the required models into the shared volume.
  # Re-runs only if models are missing (Ollama skips already-pulled models).
  ollama-model-pull:
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      - OLLAMA_LLM_MODEL=${OLLAMA_LLM_MODEL:-gemma3:4b}
    entrypoint: >
      sh -c "
        ollama pull $$OLLAMA_EMBED_MODEL &&
        ollama pull $$OLLAMA_LLM_MODEL &&
        echo 'All models ready.'
      "
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://clusterizer:clusterizer@db:5432/clusterizer
      OLLAMA_URL: http://ollama:11434
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      OLLAMA_EMBED_DIM: ${OLLAMA_EMBED_DIM:-768}
      OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-gemma3:4b}
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data_pg18:
  ollama_data:
