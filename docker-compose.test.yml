version: '3.8'

# Optional end-to-end test stack.
# Starts PostgreSQL 18+pgvector, a WireMock-based Jira simulator, and runs
# the pytest suite inside the backend container.
#
# Usage:
#   docker compose -f docker-compose.test.yml up --build --abort-on-container-exit

services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: clusterizer_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test"]
      interval: 5s
      timeout: 5s
      retries: 10

  # WireMock acts as a lightweight Jira REST API simulator.
  # Stub mapping files in ./backend/tests/wiremock/mappings/ are loaded at startup.
  jira-mock:
    image: wiremock/wiremock:3x-alpine
    ports:
      - "8090:8080"
    volumes:
      - ./backend/tests/wiremock:/home/wiremock
    command: "--port 8080 --verbose --local-response-templating"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/__admin/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-test:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://test:test@db:5432/clusterizer_test
      JIRA_MOCK_URL: http://jira-mock:8080
    command: >
      sh -c "pip install -r requirements-test.txt -q &&
             pytest tests/ -v --tb=short"
    depends_on:
      db:
        condition: service_healthy
      jira-mock:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes: {}
